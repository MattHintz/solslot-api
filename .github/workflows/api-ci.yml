name: Solslot API CI

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: solslot-api-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTOCOL_REPOSITORY: MattHintz/solslot-protocol
  # Exact coordinated protocol source from the Brick55 review candidate.
  # Deployment environment pins remain separately governed.
  PROTOCOL_REF: 9de79daa55f530dfc83c71ebfea64b03537d8563

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/solslot-protocol/build-constraints.lock
    steps:
      - name: Checkout API
        uses: actions/checkout@v4

      - name: Require exact protocol commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PROTOCOL_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SOLSLOT_PROTOCOL_REF must be an exact protocol commit." >&2
            exit 1
          fi

      - name: Checkout coordinated protocol
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTOCOL_REPOSITORY }}
          ref: ${{ env.PROTOCOL_REF }}
          path: solslot-protocol

      - name: Verify checked-out protocol identity
        run: test "$(git -C solslot-protocol rev-parse HEAD)" = "$PROTOCOL_REF"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install pip==26.2.1 wheel==0.47.0
          # Chia 2.7.x requires the yanked zstd 1.5.7.3 wheel exactly.
          python -m pip install -c constraints.lock zstd==1.5.7.3
          python -m pip install -c constraints.lock -e solslot-protocol -e '.[dev]'

      - name: Dependency audit
        run: PYTHON=python bash scripts/check_dependency_audit.sh

      - name: Audit build dependencies
        run: python -m pip_audit -r solslot-protocol/build-constraints.lock

      - name: Verify recovery dependencies and test-runner boundary
        run: >-
          python -m pytest -q
          solslot-protocol/tests/test_recovery_dependencies.py
          solslot-protocol/tests/test_dependency_provenance.py
          solslot-protocol/tests/test_test_runner_security.py

      - name: Compile and import
        run: |
          python -m compileall -q solslot_api
          python - <<'PY'
          from solslot_api.app import app

          schema = app.openapi()
          assert schema["info"]["title"] == "Solslot API"
          assert "/zkpassport/sign" not in schema["paths"]
          assert "/zkpassport/enrollments" in schema["paths"]
          PY

      - name: Test
        run: >-
          python -m pytest tests -q --durations=20
          -W error::pytest.PytestUnraisableExceptionWarning

      - name: Namespace gate
        run: python scripts/check_namespace.py --paths .

      - name: Secret scan
        run: >-
          python scripts/check_secrets.py --paths
          solslot_api tests scripts .github pyproject.toml constraints.lock
