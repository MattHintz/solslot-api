name: Solslot API CI

on:
  pull_request:
  push:
    branches: [main, staging, release/current-testnet-AE328, release/private-reader-AE335]

permissions:
  contents: read

concurrency:
  group: solslot-api-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTOCOL_REPOSITORY: MattHintz/solslot-protocol
  # Exact coordinated Testnet11 checkout protocol source.
  # Deployment environment pins remain separately governed.
  PROTOCOL_REF: b4e7d4894e8752b3faa92559c7543bf227fb7c88

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/solslot-protocol/build-constraints.lock
    steps:
      - name: Checkout API
        uses: actions/checkout@v4
        with:
          # Retained operational-guard tests verify exact historical releases.
          fetch-depth: 0

      - name: Require exact protocol commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$PROTOCOL_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SOLSLOT_PROTOCOL_REF must be an exact protocol commit." >&2
            exit 1
          fi

      - name: Checkout coordinated protocol
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTOCOL_REPOSITORY }}
          ref: ${{ env.PROTOCOL_REF }}
          path: solslot-protocol

      - name: Verify checked-out protocol identity
        run: test "$(git -C solslot-protocol rev-parse HEAD)" = "$PROTOCOL_REF"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify CI matches the approved runtime
        run: python scripts/check_runtime_lock.py

      - name: Install
        run: |
          python -m pip install pip==26.2.1 wheel==0.47.0
          # Match the approved Chia 2.7.4 runtime and constraints.lock exactly.
          python -m pip install -c constraints.lock zstd==1.5.7.2
          python -m pip install -c constraints.lock -e solslot-protocol -e '.[dev]'

      - name: Verify installed protocol source and payment key contract
        run: |
          python - <<'PY'
          import inspect
          from pathlib import Path
          from solslot_puzzles import stripe_settlement_v1_driver as driver

          assert Path(driver.__file__).resolve().is_relative_to(Path("solslot-protocol").resolve()), "Imported protocol must be the exact checked-out source"
          for prepare in (driver.prepare_chia_buyer_offer_v3, driver.prepare_chia_buyer_batch_offer_v3):
              key_kind = inspect.signature(prepare).parameters["payment_public_key_kind"]
              assert key_kind.kind is inspect.Parameter.KEYWORD_ONLY
              assert key_kind.default == "raw"
          PY

      - name: Dependency audit
        run: PYTHON=python bash scripts/check_dependency_audit.sh

      - name: Audit build dependencies
        run: python -m pip_audit -r solslot-protocol/build-constraints.lock

      - name: Verify recovery dependencies and test-runner boundary
        run: >-
          python -m pytest -q
          solslot-protocol/tests/test_recovery_dependencies.py
          solslot-protocol/tests/test_dependency_provenance.py
          solslot-protocol/tests/test_test_runner_security.py

      - name: Compile and import
        run: |
          python -m compileall -q solslot_api
          python - <<'PY'
          from solslot_api.app import app

          schema = app.openapi()
          assert schema["info"]["title"] == "Solslot API"
          assert "/zkpassport/sign" not in schema["paths"]
          assert "/zkpassport/enrollments" in schema["paths"]
          PY

      - name: Test
        run: >-
          python -m pytest tests -q --durations=20
          -W error::pytest.PytestUnraisableExceptionWarning

      - name: Namespace gate
        run: python scripts/check_namespace.py --paths .

      - name: Secret scan
        run: >-
          python scripts/check_secrets.py --paths
          solslot_api tests scripts .github ci pyproject.toml constraints.lock
